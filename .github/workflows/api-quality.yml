name: API quality

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'scripts/**'
      - '.github/workflows/api-quality.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'scripts/**'
      - '.github/workflows/api-quality.yml'

permissions:
  contents: read

concurrency:
  group: api-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install reproducibly
        run: npm ci --no-audit --no-fund

      - name: Check file limits
        run: node ../../scripts/check-file-length.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: HTTP e2e tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
